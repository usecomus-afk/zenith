<!doctype html>
<html lang="tr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zenith" />
    <meta
      name="description"
      content="Zenith — Milimetrik astronomik doğrulukla doğum haritası (Natal), Placidus ev sistemi ve anlık gökyüzü transitlerini hesaplayan interaktif mobil vektör astroloji PWA uygulaması."
    />
    <title>ZENITH — İnteraktif Astroloji &amp; Transit Haritası</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon-192.svg" />
    <link rel="apple-touch-icon" href="./icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- FULL-SCREEN INTRO SPLASH VIDEO -->
    <div
      id="zenith-intro-splash"
      role="dialog"
      aria-label="Zenith Açılış Videosu"
      style="position:fixed;inset:0;inline-size:100vw;block-size:100dvh;z-index:99999;background:#0B0E14;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.65s ease;"
    >
      <video
        id="zenith-intro-video"
        src="./zenith.mp4"
        autoplay
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        style="inline-size:100%;block-size:100%;object-fit:cover;display:block;background:#0B0E14;"
      ></video>

      <div
        class="intro-splash-controls"
        style="position:absolute;inset-block-end:max(1.5rem, env(safe-area-inset-bottom, 1.5rem));inset-inline:1.25rem;display:flex;align-items:center;justify-content:space-between;gap:0.75rem;z-index:2;pointer-events:auto;"
      >
        <button
          type="button"
          id="intro-sound-btn"
          aria-label="Sesi Aç veya Kapat"
          style="display:inline-flex;align-items:center;gap:0.4rem;padding:0.55rem 0.95rem;border-radius:9999px;border:1px solid rgba(255,255,255,0.22);background:rgba(11,14,20,0.68);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#F8FAFC;font-family:'Inter',sans-serif;font-size:0.8rem;font-weight:600;cursor:pointer;"
        >
          🔇 Sesi Aç
        </button>

        <button
          type="button"
          id="intro-skip-btn"
          aria-label="Açılış videosunu geç"
          style="display:inline-flex;align-items:center;gap:0.4rem;padding:0.55rem 1.1rem;border-radius:9999px;border:1px solid rgba(245,158,11,0.55);background:rgba(11,14,20,0.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#FDE68A;font-family:'Inter',sans-serif;font-size:0.82rem;font-weight:700;cursor:pointer;"
        >
          Uygulamaya Geç →
        </button>
      </div>
    </div>

    <div id="zenith-app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
